name: jasa-antar

# ---------------------------------------------------------------------------
# Variabel di bawah dibaca dari file .env di ROOT repository (copy .env.example).
# Rahasia API (JWT/Midtrans/Xendit/Google Maps/SMTP) tetap dibaca dari
# Backend/.env lewat env_file, TIDAK di-copy ke dalam image Docker.
# ---------------------------------------------------------------------------

x-database-url: &database-url "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD di file .env root}@postgres:5432/${POSTGRES_DB:-db_jasa_angkut}?schema=public"

x-backend-env-file: &backend-env-file
  - path: ./Backend/.env
    required: false

x-frontend-env: &frontend-env
  NODE_ENV: production
  BACKEND_URL: http://backend:3001

services:
  # -------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD di file .env root}
      POSTGRES_DB: ${POSTGRES_DB:-db_jasa_angkut}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Hanya diekspos ke host untuk debugging; hapus baris ini jika tidak perlu.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_jasa_angkut}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------------------
  # One-off job: prisma migrate deploy + seed super admin.
  # Backend baru start setelah job ini SELESAI dengan sukses.
  # -------------------------------------------------------------------------
  migrate:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: migrate
    env_file: *backend-env-file
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------------
  # NestJS API :3001
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    env_file: *backend-env-file
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: *database-url
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3002,https://localhost:3002,http://localhost:3003,http://localhost:3004}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost:3000}
      CUSTOMER_APP_URL: ${CUSTOMER_APP_URL:-https://localhost:3002}
      MITRA_APP_URL: ${MITRA_APP_URL:-http://localhost:3004}
      # Menimpa duplikat key kosong di Backend/.env (Xendit butuh https).
      XENDIT_COMPONENTS_ORIGINS: ${XENDIT_COMPONENTS_ORIGINS:-https://localhost:3002}
    volumes:
      - uploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/config/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------------------------
  # Admin dashboard :3000
  # -------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_DIR: frontend
        PORT: "3000"
        BACKEND_URL: http://backend:3001
    restart: unless-stopped
    environment:
      <<: *frontend-env
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------
  # Customer app :3002 (butuh HTTPS via reverse proxy untuk Xendit Components)
  # -------------------------------------------------------------------------
  customer:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_DIR: frontend_customer
        PORT: "3002"
        BACKEND_URL: http://backend:3001
        NEXT_PUBLIC_CUSTOMER_APP_URL: ${NEXT_PUBLIC_CUSTOMER_APP_URL:-https://localhost:3002}
        NEXT_PUBLIC_PARTNER_APP_URL: ${NEXT_PUBLIC_PARTNER_APP_URL:-http://localhost:3004}
    restart: unless-stopped
    environment:
      <<: *frontend-env
      PORT: "3002"
    ports:
      - "3002:3002"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------
  # Landing page :3003 (NEXT_PUBLIC_* di-inline saat build)
  # -------------------------------------------------------------------------
  landing:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_DIR: frontend_landingpage
        PORT: "3003"
        NEXT_PUBLIC_CUSTOMER_APP_URL: ${NEXT_PUBLIC_CUSTOMER_APP_URL:-https://localhost:3002}
        NEXT_PUBLIC_PARTNER_APP_URL: ${NEXT_PUBLIC_PARTNER_APP_URL:-http://localhost:3004}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3003"
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------
  # Mitra / driver app :3004
  # -------------------------------------------------------------------------
  mitra:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_DIR: frontend_mitra
        PORT: "3004"
        BACKEND_URL: http://backend:3001
    restart: unless-stopped
    environment:
      <<: *frontend-env
      PORT: "3004"
    ports:
      - "3004:3004"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3004').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  uploads:

sonar.projectKey=aplikasi-jasa-antar
sonar.projectName=Aplikasi Jasa Antar
sonar.projectBaseDir=.
sonar.sources=Backend/src
sonar.tests=Backend/test

# Kode hasil generate (Prisma client) dan dependency tidak dianalisis.
sonar.exclusions=**/generated/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts,**/next-env.d.ts
sonar.coverage.exclusions=**/generated/**,**/node_modules/**,**/dist/**,**/build/**,**/*.d.ts
sonar.test.exclusions=**/generated/**,**/node_modules/**,**/dist/**,**/*.d.ts

sonar.typescript.tsconfigPath=Backend/tsconfig.json
sonar.sourceEncoding=UTF-8
